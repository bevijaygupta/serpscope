name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Tests (includes 100k URL acceptance test)
        run: python -m pytest -q --disable-warnings

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docs:
    name: Required documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        shell: bash
        run: |
          required=(
            README.md INSTALLATION.md ARCHITECTURE.md DATABASE_SCHEMA.md
            API_DOCUMENTATION.md CRAWLER_METHODOLOGY.md
            ORPHAN_DETECTION_METHODOLOGY.md KEYWORD_MAPPING_METHODOLOGY.md
            PRIORITY_SCORING_METHODOLOGY.md INTEGRATIONS.md SECURITY.md
            TESTING.md DEPLOYMENT.md DEMO_GUIDE.md INTERVIEW_DEMONSTRATIONS.md
            ROADMAP.md CHANGELOG.md
          )
          missing=0
          for doc in "${required[@]}"; do
            path="docs/$doc"
            if [ "$doc" = "README.md" ]; then path="README.md"; fi
            if [ ! -s "$path" ]; then echo "Missing or empty: $path"; missing=1; fi
          done
          exit $missing
      - name: Verify product invariants
        shell: bash
        run: |
          set -e
          modules=$(grep -c "^    id: '" frontend/src/lib/modules.ts)
          docs=$(find docs -maxdepth 1 -type f -name '*.md' | wc -l | tr -d ' ')
          screenshots=$(find screenshots -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')
          scenarios=$(grep -c '^        "key":' backend/app/services/scenarios.py)
          echo "modules=$modules docs=$docs screenshots=$screenshots scenarios=$scenarios"
          [ "$modules" = "23" ] && [ "$docs" = "17" ] && [ "$screenshots" = "24" ] && [ "$scenarios" = "12" ]
