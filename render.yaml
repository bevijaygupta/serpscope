# SERPScope hosted API + Postgres on Render.
# The React UI is deployed separately on Vercel and proxies /api/* here.
previews:
  generation: off

databases:
  - name: serpscope-db
    plan: free
    region: oregon

services:
  - type: web
    name: serpscope-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # One-time synthetic demo bootstrap after the first successful deploy.
    initialDeployHook: python scripts/seed_demo.py --size 1000 --keyword-count 1000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: serpscope-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: SERPScope
      - key: RUN_JOBS_IN_API
        value: "true"
      - key: CORS_ORIGINS
        value: "https://serpscope.vercel.app"
      - key: UPLOAD_DIR
        value: /tmp/serpscope/uploads
      - key: EXPORT_DIR
        value: /tmp/serpscope/exports
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: LOG_LEVEL
        value: INFO
